<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PhishDetector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h2>&#128737; PhishDetector</h2>
    <p id="url">Click scan to analyze current page.</p>
    <label class="toggleRow" for="autoScanToggle">
      <span>Auto Scan</span>
      <input id="autoScanToggle" type="checkbox" checked>
    </label>

    <button id="scanBtn">Scan Current Site</button>

    <div id="resultBox" class="hidden">
      <h3 id="status"></h3>
      <p id="details">Risk score: -</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
